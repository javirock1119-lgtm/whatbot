services:
  - type: web
    name: hootswing-whatsapp-bot
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
    disk:
      name: whatsapp-session
      mountPath: /var/data/sesion
      sizeGB: 1
